name: nestify
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^5.0.0
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  google_sign_in: ^6.2.2
  intl: ^0.19.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3
  firebase_storage: ^12.3.4
  file_picker: ^8.1.2
  url_launcher: ^6.3.1
  pdf: ^3.11.1
  printing: ^5.13.3
  path_provider: ^2.1.5
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  cloudinary_public: ^0.23.1
  http: ^1.2.0
  image: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
